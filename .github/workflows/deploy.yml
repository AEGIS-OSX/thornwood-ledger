name: Deploy and Verify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: curl -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      - name: Wait for deploy to propagate
        run: sleep 60

      - name: Verify deployment SHA
        run: |
          LIVE_SHA=$(curl -s "${LIVE_URL}/api/version" | jq -r '.sha')
          if [ "$LIVE_SHA" != "$GITHUB_SHA" ]; then
            echo "SHA mismatch: expected $GITHUB_SHA, got $LIVE_SHA"
            exit 1
          fi
        env:
          LIVE_URL: ${{ secrets.LIVE_URL }}
